<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.tcgdex.net; base-uri 'none'; form-action 'none'"><title>Cardora | Card search preview</title><style>
*{box-sizing:border-box}body{background:#110d19;color:#eee;font:16px/1.5 system-ui,sans-serif;margin:0}main{max-width:760px;margin:auto;padding:20px}h1,h2,a{color:#e9ce88}h1{font-size:30px}.panel,article{border:1px solid #51405f;border-radius:14px;padding:16px;background:#20162c;margin:12px 0}label{display:block;margin:12px 0 4px}input,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #806b9a}input{width:100%;background:#100c17;color:white}button{background:#e9ce88;color:#21172a;font-weight:700;cursor:pointer;margin-top:10px}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}small,p{color:#c5b8d3}article strong{display:block;color:#f3d994}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body><main><a href="/">CARDORA</a><h1>Card Search · 卡牌查询</h1><p>测试版：输入英文卡牌名称或编号，查找资料。暂不显示图片或价格，不用于鉴定真伪。</p><section class="panel"><form id="search"><label for="name">Card name · 英文名称</label><input id="name" maxlength="60" placeholder="Pikachu ex" autocomplete="off"><label for="number">Card number · 卡牌编号（可选）</label><input id="number" maxlength="16" placeholder="054" autocomplete="off"><button id="submit" type="submit">Search · 查询</button></form><p id="status" role="status" aria-live="polite">请输入名称或编号。</p><div id="results"></div><div class="actions"><button id="prev" disabled>上一页</button><button id="next" disabled>下一页</button></div></section><section class="panel"><h2>My Collection · 本机收藏</h2><p>仅保存在此浏览器；不关联会员账户，不上传照片或个人资料。清除浏览器数据会删除收藏。</p><p id="savedStatus" role="status"></p><div id="saved"></div></section><small>Card metadata supplied by <a href="https://tcgdex.dev/">TCGdex</a>. Unofficial reference data; no endorsement or authenticity guarantee. Cardora preview only.</small></main><script>
'use strict';
const $=id=>document.getElementById(id);
const STORE='cardora-catalog-local-preview-v1',PAGE=20,LIMIT=200;
let collection=[],page=1,query=null,busy=false,storageReady=true;
function cardRecord(x){return x&&typeof x.id==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(x.id)&&typeof x.name==='string'&&x.name.length>0&&x.name.length<=200&&typeof x.localId==='string'&&x.localId.length<=32?{id:x.id,name:x.name,localId:x.localId}:null;}
function load(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');if(Array.isArray(a))collection=[...new Map(a.slice(0,LIMIT).map(cardRecord).filter(Boolean).map(c=>[c.id,c])).values()]}catch{storageReady=false;$('savedStatus').textContent='本机存储不可用。';}}
function persist(next){if(!storageReady)return false;try{localStorage.setItem(STORE,JSON.stringify(next));collection=next;return true}catch{$('savedStatus').textContent='保存失败，请检查浏览器存储。';return false}}
function render(container,rows,saved){container.replaceChildren();for(const card of rows){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),b=document.createElement('button');h.textContent=card.name;p.textContent='编号 '+card.localId+' · 数据库 ID '+card.id;b.type='button';b.textContent=saved?'移除本机收藏':'加入本机收藏';b.addEventListener('click',()=>{if(saved){if(persist(collection.filter(x=>x.id!==card.id)))render($('saved'),collection,true)}else if(collection.some(x=>x.id===card.id)){$('savedStatus').textContent='已经收藏。'}else if(collection.length>=LIMIT){$('savedStatus').textContent='测试版最多保存200张不同卡牌。'}else if(persist([...collection,card])){$('savedStatus').textContent='已保存 '+card.name;render($('saved'),collection,true)}});a.append(h,p,b);container.append(a)}}
function buildURL(q,p){const u=new URL('https://api.tcgdex.net/v2/en/cards');if(q.name)u.searchParams.set('name',q.name);if(q.number)u.searchParams.set('localId','eq:'+q.number);u.searchParams.set('pagination:page',String(p));u.searchParams.set('pagination:itemsPerPage',String(PAGE));return u}
async function search(p){if(busy||!query)return;busy=true;$('submit').disabled=true;$('prev').disabled=true;$('next').disabled=true;$('status').textContent='正在查询…';$('results').replaceChildren();const c=new AbortController(),timer=setTimeout(()=>c.abort(),10000);try{const r=await fetch(buildURL(query,p),{signal:c.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('API unavailable');const data=await r.json();if(!Array.isArray(data)||data.length>PAGE)throw Error('Unexpected response');const rows=data.map(cardRecord).filter(Boolean);page=p;render($('results'),rows,false);$('status').textContent=rows.length?'第 '+page+' 页 · '+rows.length+' 条匹配':'没有匹配资料，请检查名称或编号（包括前导零）。';$('prev').disabled=page<=1;$('next').disabled=data.length<PAGE||page>=20;}catch{$('status').textContent='暂时无法查询，请稍后重试。';$('prev').disabled=page<=1;}finally{clearTimeout(timer);busy=false;$('submit').disabled=false;}}
$('search').addEventListener('submit',e=>{e.preventDefault();if(busy)return;const name=$('name').value.trim(),number=$('number').value.trim();if((!name&&!number)||(name&&!/^[A-Za-z0-9 .’'&_-]{1,60}$/.test(name))||(number&&!/^[A-Za-z0-9-]{1,16}$/.test(number))){$('status').textContent='请输入有效英文名称或卡牌编号。';return}query={name,number};search(1)});
$('prev').addEventListener('click',()=>search(page-1));$('next').addEventListener('click',()=>search(page+1));load();render($('saved'),collection,true);
</script></body></html>
