name: Cardora integrated release gates
on:
  push:
    branches: [draft/integrated-release-20261125]
  pull_request:
    paths: ['vercel.json','scripts/build-public-site.mjs','join.html','fees.html','rules-preview.html','member-collection-preview.html','packs-live-preview.html','scripts/test-integrated-release-gates.mjs','.github/workflows/cardora-integrated-release.yml']
permissions:
  contents: read
jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/test-integrated-release-gates.mjs
      - run: node scripts/test-member-release-offline.mjs
      - run: node scripts/test-member-collection-preview.mjs
      - run: node scripts/test-card-catalog-offline.mjs
      - run: node scripts/test-rewards-finance-preview.mjs
      - name: Verify production static allowlist
        run: |
          VERCEL_ENV=production node scripts/build-public-site.mjs
          test -f dist/index.html
          test -f dist/join.html
          test -f dist/fees.html
          test ! -e dist/scripts
          test ! -e dist/supabase
          test ! -e dist/docs
          test ! -e dist/SECURITY_AUDIT.md
          test ! -e dist/member-collection-preview.html
          test ! -e dist/collection-preview.html
          test ! -e dist/packs-live-preview.html
      - name: Verify protected preview assets
        run: |
          VERCEL_ENV=preview node scripts/build-public-site.mjs
          test -f dist/member-collection-preview.html
          test -f dist/collection-preview.html
          test -f dist/packs-live-preview.html
          test ! -e dist/supabase
          test ! -e dist/docs
