name: Cardora legacy commercial isolation
on:
  pull_request:
    paths:
      - 'docs/security/legacy-commercial-isolation-review.sql'
      - 'docs/security/legacy-isolation/**'
      - 'scripts/test-legacy-commercial-isolation.sql'
      - 'scripts/test-legacy-payment-disabled.mjs'
      - '.github/workflows/legacy-commercial-isolation.yml'
permissions:
  contents: read
jobs:
  isolated-acl-and-disabled-handlers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: legacy_isolation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legacy_isolation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test exact ACL draft with synthetic identities and historical data
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: synthetic_test_password
          PGDATABASE: legacy_isolation_test
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-legacy-commercial-isolation.sql
      - name: Test two disabled edge handlers without secrets or network
        run: node scripts/test-legacy-payment-disabled.mjs
