name: Cardora card catalog offline
on:
  push:
    branches: [draft/card-catalog-20261125]
  pull_request:
    paths: ['collection-preview.html','scripts/test-card-catalog-offline.mjs','.github/workflows/cardora-card-catalog.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/test-card-catalog-offline.mjs
