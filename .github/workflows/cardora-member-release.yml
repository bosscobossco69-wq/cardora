name: Cardora member release offline
on:
  pull_request:
    paths:
      - 'join.html'
      - 'scripts/test-member-release-offline.mjs'
      - '.github/workflows/cardora-member-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-member-release-offline.mjs
